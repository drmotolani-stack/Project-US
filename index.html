    .mono { font-family: "Space Mono", monospace; }
    .glass {
      background: rgba(36,23,28,.82);

    .ring {

      width: 23px; height: 23px; border-radius: 8px;

    .tab-active { color: var(--cream); }

    .sheet.open { transform: translateY(0); }

    .toast {
      position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 20px);

      background: #f5f0e8; color: #241318; border-radius: 999px;

    .recording {

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtDate(d = new Date()) {

}
function otherPerson() { return currentUser === "Motolani" ? "Zusi" : "Motolani"; }
function getPronoun(person) { return person === "Motolani" ? "His" : "Her"; }
function esc(v="") {
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function timeAgo(ts) {
  const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : new Date());
  const mins = Math.floor((Date.now()-d.getTime())/60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const h = Math.floor(mins/60);
  if (h < 24) return `${h}h ago`;
  const days = Math.floor(h/24);
  return `${days}d ago`;
}

window.startDictation = function(inputId) {
  if (!('webkitSpeechRecognition' in window)) {
    showToast("Speech to text is not supported in this browser.");
    return;
  }
  const recognition = new webkitSpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onstart = function() { showToast("Listening... Speak now."); };
  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = 0; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript;
    }
    const inputEl = document.getElementById(inputId);
    inputEl.value = transcript;
  };
  recognition.onerror = function() { showToast("Microphone error."); };
  recognition.start();
};

function attachVoiceRecorder(buttonId, previewId, statusId) {
  let recorder = null, stream = null, chunks = [], blob = null;
  const btn = document.getElementById(buttonId);
  const status = document.getElementById(statusId);
  const preview = document.getElementById(previewId);
  if (!btn) return { getBlob:()=>blob };

  btn.addEventListener("click", async () => {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      showToast("Voice recording isn't supported in this browser.");
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstart = () => {
        btn.classList.add("recording");
        status.textContent = "Recording... tap to stop.";
      };
      recorder.onstop = () => {
        blob = new Blob(chunks, {type: recorder.mimeType || "audio/webm"});
        preview.src = URL.createObjectURL(blob);
        preview.classList.remove("hidden");
        btn.classList.remove("recording");
        status.textContent = "Voice note ready. You can save it below.";
        stream?.getTracks().forEach(t=>t.stop());
      };
      recorder.start();
    } catch (e) {
      console.error(e);
      showToast("Microphone permission was not granted.");
    }
  });
  return { getBlob:()=>blob };
}

async function uploadAudio(blob, prefix="voice") {
  const ext = blob.type.includes("mp4") ? "m4a" : "webm";
  const path = `${prefix}/${Date.now()}_${currentUser}.${ext}`;
  const r = ref(storage, path);
  await uploadBytes(r, blob);
  return await getDownloadURL(r);
}

async function saveEntry({type="Note", text="", audioBlob=null, imageFile=null, scope="personal", extra={}}) {
  if (!text && !audioBlob && !imageFile) {
    showToast("Add some text, a voice note, or an image first.");
    return;
  }
  let audioUrl = null, imageUrl = null;
  if (audioBlob) audioUrl = await uploadAudio(audioBlob, "voice_notes");
  if (imageFile) {
    const path = `memories/${Date.now()}_${imageFile.name}`;
    const r = ref(storage, path);
    await uploadBytes(r, imageFile);
    imageUrl = await getDownloadURL(r);
  }
  await addDoc(collection(db, "entries"), {
    type, text, audioUrl, imageUrl,
    sender: currentUser, scope,
    createdAt: serverTimestamp(),
    ...extra
  });
  closeSheet();
  showToast("Saved.");
}

function isActiveRoutine(r) {
  if (r.archived) return false;
  if (r.startDate && todayKey() < r.startDate) return false;
  if (r.endDate && todayKey() > r.endDate) return false;
  return true;
}

window.toggleRoutine = async function(id) {
  const key = `${todayKey()}_${id}`;
  const r = routines.find(x=>x.id===id);
  if (!r) return;
  const refDoc = doc(db, "routine_completions", key);
  try {
    if (completions[key]) {
      await deleteDoc(refDoc);
      delete completions[key];
    } else {
      await setDoc(refDoc, {routineId:id, owner:r.owner, date:todayKey(), completedBy:currentUser, completedAt:serverTimestamp()});
      completions[key] = true;
    }
    render();
  } catch(e) {
    console.error(e);
    showToast("Couldn't update. Check Firestore rules.");
  }
};

window.openRoutineEditor = function(editId=null) {
  const r = editId ? routines.find(x=>x.id===editId) : null;
  document.getElementById("routine-title").textContent = r ? "Edit routine" : "Add routine";
  document.getElementById("routine-body").innerHTML = `
    <form id="routine-form" class="space-y-4">
      <input type="hidden" id="routine-id" value="${r?.id || ""}">
      <div><label class="tiny-label">Routine</label><input id="r-name" class="input mt-2" required value="${esc(r?.name || "")}" placeholder="e.g. Prayer"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="tiny-label">Frequency</label>
          <select id="r-frequency" class="input mt-2">
            ${["daily","weekly","project"].map(v=>`<option ${r?.frequency===v?"selected":""} value="${v}">${v[0].toUpperCase()+v.slice(1)}</option>`).join("")}
          </select>
        </div>
        <div><label class="tiny-label">Category</label><input id="r-category" class="input mt-2" value="${esc(r?.category || "")}" placeholder="Spiritual"></div>
      </div>
      <label class="flex items-center gap-3 p-3 rounded-2xl bg-white/[.03]"><input id="r-nonneg" type="checkbox" ${r?.nonNegotiable?"checked":""}><span><span class="text-sm block">Non-negotiable</span><span class="subtle text-xs">Keep it visible as a core routine.</span></span></label>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="tiny-label">Start date</label><input id="r-start" type="date" class="input mt-2" value="${r?.startDate || ""}"></div>

      </div>

    ev.preventDefault();

      category: document.getElementById("r-category").value.trim() || "Other",

    } catch(e) { console.error(e); showToast("Couldn't save routine."); }

      ${speechToTextBtn("entry-text")}
      <button id="save-life" class="primary w-full">Save to Our Life</button>
    </div>`);
  
  document.getElementById("save-life").onclick = async () => {
    try {
      const title = document.getElementById("life-title").value.trim();
      const text = document.getElementById("entry-text").value.trim();
      if(!title) return showToast("Title is required.");
      await addDoc(collection(db,"life_items"),{
        type: payload.type, title, text, icon: payload.icon,
        owner: currentUser, createdAt: serverTimestamp()
      });
      closeSheet(); showToast("Saved to Our Life.");
    } catch(e){console.error(e);showToast("Couldn't save item.");}
  };
}

function renderSharedComposer(payload={}) {
  const isEdit = !!payload.editId;
  const s = isEdit ? sharedItems.find(x => x.id === payload.editId) : null;
  
  setComposer(isEdit ? "Edit shared item" : "Add shared item", "Together", `
    <div class="space-y-4">
      <input type="hidden" id="s-id" value="${s?.id || ""}">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="tiny-label">Type</label>
          <select id="s-type" class="input mt-2">
            ${["Book","Message","Conversation","Agreement","Prayer","Topic","Shared activity"].map(v => `<option ${s?.type===v?'selected':''}>${v}</option>`).join("")}
          </select>
        </div>
        <div><label class="tiny-label">Month</label><input id="s-month" class="input mt-2" value="${s?.month || monthName()}"></div>
      </div>
      <input id="s-title" class="input" placeholder="Title" value="${esc(s?.title || "")}">
      <input id="s-subtitle" class="input" placeholder="Short description / speaker / question" value="${esc(s?.subtitle || "")}">
      <div class="grid grid-cols-2 gap-3">
         <input id="s-link" class="input" placeholder="Link URL" value="${esc(s?.link || "")}">
         <input id="s-where" class="input" placeholder="Where to find (e.g. Telegram)" value="${esc(s?.where || "")}">
      </div>
      <select id="s-icon" class="input"><option ${s?.icon==='♡'?'selected':''}>♡</option><option ${s?.icon==='📖'?'selected':''}>📖</option><option ${s?.icon==='🎧'?'selected':''}>🎧</option><option ${s?.icon==='💬'?'selected':''}>💬</option><option ${s?.icon==='🤝'?'selected':''}>🤝</option><option ${s?.icon==='✦'?'selected':''}>✦</option></select>
      
      ${!isEdit ? `
        ${voiceRecorderHtml("shared-rec")}
        <textarea id="s-note" class="input" placeholder="Optional first thought..."></textarea>
      ` : ""}
      <button id="save-shared" class="primary w-full">${isEdit ? "Save changes" : "Add to Together"}</button>
    </div>`);
    
  let recorder = null;
  if(!isEdit) recorder = attachVoiceRecorder("shared-rec","shared-rec-preview","shared-rec-status");
  
  document.getElementById("save-shared").onclick = async () => {
    try {
      const title=document.getElementById("s-title").value.trim();
      if(!title) return showToast("Give this item a title.");
      
      const payloadData = {
        type: document.getElementById("s-type").value,
        month: document.getElementById("s-month").value.trim() || monthName(),
        title, 
        subtitle: document.getElementById("s-subtitle").value.trim(),
        link: document.getElementById("s-link").value.trim(),
        where: document.getElementById("s-where").value.trim(),
        icon: document.getElementById("s-icon").value,
        status: "Active", active: true, owner: currentUser
      };
      
      if(isEdit) {
        await updateDoc(doc(db, "shared_items", s.id), {...payloadData, updatedAt: serverTimestamp()});
      } else {
        const audioBlob=recorder.getBlob();
        const audioUrl=audioBlob ? await uploadAudio(audioBlob,"shared_voice") : null;
        await addDoc(collection(db,"shared_items"),{...payloadData, createdAt:serverTimestamp()});
        const note=document.getElementById("s-note").value.trim();
        if(note || audioUrl) await addDoc(collection(db,"entries"),{type:"Shared thought",text:note,audioUrl,sender:currentUser,scope:"shared",createdAt:serverTimestamp()});
      }
      closeSheet(); showToast(isEdit ? "Updated." : "Added to Together.");
    } catch(e){console.error(e);showToast("Couldn't save shared item.");}
  };
}

function renderEntryComposer(payload={}) {
  const item=sharedItems.find(x=>x.id===payload.sharedId);
  setComposer(item ? item.title : "Shared entry", item ? (item.type || "Together") : "Together", `
    <div class="space-y-4">
      ${item ? `<div class="card p-4"><div class="tiny-label">${esc(item.type || "Shared")}</div><div class="serif text-xl mt-1">${esc(item.title)}</div><div class="subtle text-sm mt-1">${esc(item.subtitle || "")}</div></div>` : ""}
      <textarea id="entry-text" class="input" placeholder="Capture your thought, answer, reaction or conclusion..."></textarea>
      ${speechToTextBtn("entry-text")}
      ${voiceRecorderHtml("entry-rec")}
      <button id="save-entry" class="primary w-full">Save to this</button>
    </div>`);
  const recorder=attachVoiceRecorder("entry-rec","entry-rec-preview","entry-rec-status");
  document.getElementById("save-entry").onclick=async()=>{
    try {
      await saveEntry({type:item ? `${item.type || "Shared"} thought` : "Together note", text:document.getElementById("entry-text").value.trim(), audioBlob:recorder.getBlob(), scope:"shared", extra:{sharedItemId:item?.id || null}});
    } catch(e){console.error(e);showToast("Couldn't save entry.");}
  };
}

function render() {
  if (activeTab==="today") renderToday();
  if (activeTab==="together") renderTogether();
  if (activeTab==="life") renderLife();
  if (activeTab==="memory") renderMemory();
}

function listenAll() {
  unsubscribers.forEach(fn=>fn());
  unsubscribers=[];
  unsubscribers.push(onSnapshot(query(collection(db,"routines"),orderBy("createdAt","asc")), snap=>{
    routines=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("routines",err)));

  unsubscribers.push(onSnapshot(collection(db,"routine_completions"), snap=>{
    completions={};
    snap.forEach(d=>{ const x=d.data(); if(x.date===todayKey()) completions[d.id]=true; });
    render();
  }, err=>console.error("completions",err)));

  unsubscribers.push(onSnapshot(query(collection(db,"shared_items"),orderBy("createdAt","desc")), snap=>{
    sharedItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("shared",err)));

  unsubscribers.push(onSnapshot(query(collection(db,"entries"),orderBy("createdAt","desc"),limit(40)), snap=>{
    recentEntries=snap.docs.map(d=>({id:d.id,...d.data()}));
    memories=recentEntries.filter(x=>x.type==="Memory");
    render();
    maybeNotify(recentEntries[0]);
  }, err=>console.error("entries",err)));

  unsubscribers.push(onSnapshot(query(collection(db,"life_items"),orderBy("createdAt","desc"),limit(50)), snap=>{
    lifeItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("life",err)));
  
  unsubscribers.push(onSnapshot(query(collection(db,"todos"),orderBy("createdAt","desc")), snap=>{
    todos=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("todos",err)));
}

let lastNotifiedId = sessionStorage.getItem("last_notified_entry");
function maybeNotify(e) {
  if (!e?.id || !e.sender || e.sender===currentUser || e.id===lastNotifiedId) return;
  lastNotifiedId=e.id; sessionStorage.setItem("last_notified_entry",e.id);
  if (document.hidden && "Notification" in window && Notification.permission==="granted") {
    new Notification(`${e.sender} added ${e.type || "something"} to Our Space`, {body:e.text ? e.text.slice(0,90) : "Tap to open Our Space."});
  }
}

async function seedIfEmpty() {
  const snap=await getDocs(query(collection(db,"routines"),limit(1)));
  if (!snap.empty) return;
  for (const owner of PEOPLE) {
    for (const [name,frequency,category,nonNegotiable] of starterRoutines[owner]) {
      await addDoc(collection(db,"routines"),{
        name, frequency, category, nonNegotiable, owner,
        archived:false, createdAt:serverTimestamp(), updatedAt:serverTimestamp()
      });
    }
  }
}

document.getElementById("identity").value=currentUser;
document.getElementById("identity").addEventListener("change", e=>{
  currentUser=e.target.value;
  localStorage.setItem("our_space_identity",currentUser);
  render();
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ closeSheet(); closeRoutineSheet(); }
});

try {
  await seedIfEmpty();
  listenAll();
  render();
} catch(e) {
  console.error(e);
  document.getElementById("app").innerHTML=`<div class="card p-6 mt-6"><h2 class="serif text-2xl">Firebase needs attention.</h2><p class="subtle text-sm mt-2">The app loaded, but it couldn't reach Firestore. Check your Firebase project, Firestore database and security rules.</p><pre class="mono text-[10px] mt-4 whitespace-pre-wrap opacity-60">${esc(e.message)}</pre></div>`;
}
</script>
