  <style>
    :root {
      --bg: #171012;
      --panel: #24171c;
      --panel2: #2c1b22;
      --wine: #7d394d;
      --olive: #5f7442;
      --cream: #f5f0e8;
      --muted: #a99d9d;
      --line: rgba(255,255,255,.09);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% -10%, rgba(125,57,77,.20), transparent 34%),
        radial-gradient(circle at 100% 0%, rgba(95,116,66,.10), transparent 28%),
        var(--bg);
      color: var(--cream);
      font-family: Jost, system-ui, sans-serif;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .serif { font-family: Fraunces, Georgia, serif; }
    .mono { font-family: "Space Mono", monospace; }
    .glass {
      background: linear-gradient(180deg,rgba(48,31,38,.76),rgba(27,18,22,.72));
      backdrop-filter: blur(24px) saturate(130%);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
      border: 1px solid var(--line);
    }
    .card {
      background: linear-gradient(145deg, rgba(50,29,37,.92), rgba(31,20,24,.94));
      border: 1px solid var(--line);
      border-radius: 22px;
    }
    .subtle { color: var(--muted); }
    .tiny-label {
      font: 700 10px/1.2 "Space Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--muted);
    }
    .fade { animation: fade .22s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .ring {
      background: conic-gradient(var(--olive) var(--pct), rgba(255,255,255,.08) 0);
    }
    .check {
      width: 23px; height: 23px; border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,.28);
      display: grid; place-items: center; flex: 0 0 auto;
      transition: .18s ease;
    }
    .check.done { background: var(--olive); border-color: var(--olive); }
    .check.done::after { content: '✓'; font-size: 13px; font-weight: 700; }
    .tab-active { color: var(--cream); }
    .tab-active .tab-dot { opacity: 1; transform: scale(1); }
    .tab-dot { opacity: 0; transform: scale(.5); transition: .2s; }
    .sheet {
      position: fixed; inset: auto 0 0 0; z-index: 60;
      transform: translateY(110%); transition: transform .28s cubic-bezier(.22,1,.36,1);
      max-height: 92vh; overflow: auto;
    }
    .sheet.open { transform: translateY(0); }
    .scrim {
      position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.56);
      opacity: 0; pointer-events: none; transition: opacity .22s;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .toast {
      position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 20px);
      z-index: 100; opacity: 0; pointer-events: none; transition: .2s;
      background: #f5f0e8; color: #241318; border-radius: 999px;
      padding: 10px 16px; font-size: 13px; white-space: nowrap;
      box-shadow: 0 12px 40px rgba(0,0,0,.3);
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }
    .recording {
      animation: pulse 1.15s infinite;
      box-shadow: 0 0 0 9px rgba(125,57,77,.15), 0 0 0 18px rgba(125,57,77,.07);
    }
    @keyframes pulse { 50% { transform: scale(1.04); } }
    textarea { min-height: 100px; resize: vertical; }
    .scroll-x { overflow-x: auto; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }
    .progress-bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }

    .vision-board { background-image: radial-gradient(circle, rgba(255,255,255,.09) 1px, transparent 1px); background-size: 18px 18px; }
    .progress-fill { height: 100%; background: var(--olive); border-radius: inherit; transition: width .3s ease; }
    .voice-btn {
      width: 48px; height: 48px; border-radius: 50%; background: var(--wine);
      display: grid; place-items: center; flex: 0 0 auto;
    }
    .empty { border: 1px dashed rgba(255,255,255,.14); border-radius: 18px; }
    .chip {
      border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.035);
      border-radius: 999px; padding: 7px 11px; font-size: 12px;
    }
    .input {
      width: 100%; background: rgba(0,0,0,.16); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px 13px; color: var(--cream); outline: none;
    }
    .input:focus { border-color: rgba(125,57,77,.8); }
    .primary {
      background: var(--wine); color: white; border-radius: 14px; padding: 12px 15px;
      font-size: 14px; font-weight: 600;
    }
    .secondary {
      background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--cream);
      border-radius: 14px; padding: 12px 15px; font-size: 14px;
    }
    .danger { color: #d79ba9; }
    .hero-glow{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(113,51,69,.72),rgba(39,25,31,.88) 52%,rgba(75,91,50,.28));border:1px solid rgba(255,255,255,.10);border-radius:30px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
    .hero-glow::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;background:rgba(199,168,117,.12);filter:blur(8px);pointer-events:none}
    .eyebrow{font:700 9px/1.2 "Space Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,240,229,.56)}
    .soft-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.075);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
    .value-card{min-height:132px;padding:18px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(0,0,0,.10));border:1px solid rgba(255,255,255,.075);transition:.2s ease}
    .value-card:hover{border-color:rgba(199,168,117,.22);transform:translateY(-2px)}
    .icon-action{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);font-size:11px;transition:.16s ease}
    .icon-action:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
    .icon-action.danger:hover{background:rgba(170,65,84,.22);color:#f0a9b6}
    .action-group{display:flex;align-items:center;gap:6px;flex:0 0 auto}
    .vision-pin{box-shadow:0 22px 45px rgba(0,0,0,.28),0 3px 8px rgba(0,0,0,.18);transition:box-shadow .18s ease,transform .18s ease}
    .vision-pin:hover{box-shadow:0 28px 60px rgba(0,0,0,.35);transform:translateY(-2px) rotate(.2deg)}
    @media (min-width: 900px) {
      .app-shell { max-width: 1120px; margin: 0 auto; }
      .desktop-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
      .sheet { left: 50%; right: auto; width: 640px; transform: translate(-50%,110%); border-radius: 28px 28px 0 0; }
      .sheet.open { transform: translate(-50%,0); }
    }

    .soft-chip{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;border:1px solid rgba(236,223,201,.11);background:rgba(255,255,255,.045);font-size:10px;letter-spacing:.04em;color:rgba(243,234,219,.72)}

    .secondary{background:rgba(255,255,255,.055);border-color:rgba(236,223,201,.11);border-radius:16px}.secondary:hover{background:rgba(255,255,255,.09)}

    .value-card:hover{border-color:rgba(205,180,138,.28);transform:translateY(-3px);box-shadow:0 18px 45px rgba(0,0,0,.15)}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateKey(d=new Date()) {
  const x=d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
function weekKey(d=new Date()) {
  const x=new Date(d); x.setHours(0,0,0,0);
  const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day);
  return `week_${dateKey(x)}`;
}
function routineCompletionKey(r, d=new Date()) {
  if (r.frequency === "weekly") return `${weekKey(d)}_${r.id}`;
  if (r.frequency === "project") return `project_${r.id}`;
  return `${dateKey(d)}_${r.id}`;
}
function fmtDateTime(ts) {
  const d=ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : new Date());
  return d.toLocaleString("en-US", {month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"});
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d; }
function percent(a,b){ return b ? Math.round(a/b*100) : 0; }

function timeAgo(ts) {
  const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : new Date());
  const mins = Math.floor((Date.now()-d.getTime())/60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const h = Math.floor(mins/60);
  if (h < 24) return `${h}h ago`;
  const days = Math.floor(h/24);
  return `${days}d ago`;
}

window.startDictation = function(inputId) {
  if (!('webkitSpeechRecognition' in window)) {
    showToast("Speech to text is not supported in this browser.");
    return;
  }
  const recognition = new webkitSpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onstart = function() { showToast("Listening... Speak now."); };
  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = 0; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript;
    }
    const inputEl = document.getElementById(inputId);
    inputEl.value = transcript;
  };
  recognition.onerror = function() { showToast("Microphone error."); };
  recognition.start();
};

function attachVoiceRecorder(buttonId, previewId, statusId) {
  let recorder = null, stream = null, chunks = [], blob = null;
  const btn = document.getElementById(buttonId);
  const status = document.getElementById(statusId);
  const preview = document.getElementById(previewId);
  if (!btn) return { getBlob:()=>blob };

  btn.addEventListener("click", async () => {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      showToast("Voice recording isn't supported in this browser.");
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstart = () => {
        btn.classList.add("recording");
        status.textContent = "Recording... tap to stop.";
      };
      recorder.onstop = () => {
        blob = new Blob(chunks, {type: recorder.mimeType || "audio/webm"});
        preview.src = URL.createObjectURL(blob);
        preview.classList.remove("hidden");
        btn.classList.remove("recording");
        status.textContent = "Voice note ready. You can save it below.";
        stream?.getTracks().forEach(t=>t.stop());
      };
      recorder.start();
    } catch (e) {
      console.error(e);
      showToast("Microphone permission was not granted.");
    }
  });
  return { getBlob:()=>blob };
}

async function uploadAudio(blob, prefix="voice") {
  const ext = blob.type.includes("mp4") ? "m4a" : "webm";
  const path = `${prefix}/${Date.now()}_${currentUser}.${ext}`;
  const r = ref(storage, path);
  await uploadBytes(r, blob);
  return {url:await getDownloadURL(r), path};
}

function renderVisionPin(v){

function hashCode(str=''){let h=0;for(let i=0;i<str.length;i++)h=((h<<5)-h)+str.charCodeAt(i)|0;return h;}
function attachVisionDrag(el){
  let dragging=false; el.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;dragging=true;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing';});
  el.addEventListener('pointermove',e=>{if(!dragging)return;const board=el.parentElement,r=board.getBoundingClientRect();let x=((e.clientX-r.left-el.offsetWidth/2)/r.width)*100,y=((e.clientY-r.top-el.offsetHeight/2)/r.height)*100;x=Math.max(0,Math.min(78,x));y=Math.max(0,Math.min(78,y));el.style.left=x+'%';el.style.top=y+'%';});
  el.addEventListener('pointerup',async()=>{if(!dragging)return;dragging=false;el.style.cursor='grab';const board=el.parentElement,r=board.getBoundingClientRect();const x=(el.offsetLeft/r.width)*100,y=(el.offsetTop/r.height)*100;try{await updateDoc(doc(db,'life_items',el.dataset.visionId),{x,y,updatedAt:serverTimestamp()});}catch(e){console.error(e);}});

function routineStatsFor(owner,range=30){const mine=routines.filter(r=>r.owner===owner&&!r.archived),cutoff=daysAgo(range-1),now=new Date();let expected=0,done=0;const per=mine.map(r=>{let exp=0,dn=0;if(r.frequency==='daily'){let d=new Date(Math.max(new Date(r.startDate||cutoff).getTime(),cutoff.getTime())),end=new Date(Math.min(new Date(r.endDate||now).getTime(),now.getTime()));while(d<=end){exp++;if(completionHistory.some(c=>c.routineId===r.id&&c.date===dateKey(d)))dn++;d.setDate(d.getDate()+1);}}else if(r.frequency==='weekly'){let d=new Date(cutoff),seen=new Set();while(d<=now){const k=weekKey(d);if(!seen.has(k)){exp++;seen.add(k);if(completionHistory.some(c=>c.routineId===r.id&&c.period===k))dn++;}d.setDate(d.getDate()+1);}}else{exp=1;dn=completionHistory.some(c=>c.routineId===r.id&&c.period==='project')?1:0;}expected+=exp;done+=dn;return{r,exp,dn,pct:percent(dn,exp)};});return{owner,expected,done,pct:percent(done,expected),per};}
function sharedPulseStats(range=30){const cutoff=daysAgo(range-1);const inRange=x=>{const d=x.createdAt?.toDate?x.createdAt.toDate():new Date(x.createdAt||0);return d>=cutoff};const books=sharedItems.filter(x=>x.type==='Book'&&inRange(x)&&String(x.status||'').toLowerCase()==='completed').length;const messages=sharedItems.filter(x=>x.type==='Message'&&inRange(x)&&String(x.status||'').toLowerCase()==='completed').length;const conversations=sharedItems.filter(x=>['Conversation','Topic'].includes(x.type)&&inRange(x)).length;const rhythmCompletions=completionHistory.filter(c=>c.shared&&c.date>=dateKey(cutoff)).length;const days=Math.max(1,range);const rhythmExpected=days*3;return{books,messages,conversations,rhythmCompletions,rhythmExpected};}

function isActiveRoutine(r) {
  if (r.archived) return false;
  if (r.startDate && todayKey() < r.startDate) return false;
  if (r.endDate && todayKey() > r.endDate) return false;
  return true;
}

window.toggleRoutine = async function(id) {
  const r = routines.find(x=>x.id===id);
  const key = r ? routineCompletionKey(r) : null;
  if (!r) return;
  const refDoc = doc(db, "routine_completions", key);
  try {
    if (completions[key]) {
      await deleteDoc(refDoc);
      delete completions[key];
    } else {
      await setDoc(refDoc, {routineId:id, owner:r.owner, date:todayKey(), period:r.frequency === "weekly" ? weekKey() : r.frequency === "project" ? "project" : todayKey(), frequency:r.frequency, completedBy:currentUser, completedAt:serverTimestamp()});
      completions[key] = true;
    }
    render();
  } catch(e) {
    console.error(e);
    showToast("Couldn't update. Check Firestore rules.");
  }
};

window.archiveRoutine = async function(id) {
  if(!confirm("Delete this routine and its completion history?")) return;
  try {
    await deleteDoc(doc(db,"routines",id));
    const related=completionHistory.filter(c=>c.routineId===id);
    for(const c of related){ try{await deleteDoc(doc(db,"routine_completions",c.id));}catch(_){}}
    closeRoutineSheet(); showToast("Routine deleted.");
  } catch(e) { console.error(e); showToast("Couldn't delete routine."); }
};

function listenAll() {
  unsubscribers.forEach(fn=>fn());
  unsubscribers=[];
  unsubscribers.push(onSnapshot(query(collection(db,"routines"),orderBy("createdAt","asc")), snap=>{
    routines=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("routines",err)));

  unsubscribers.push(onSnapshot(collection(db,"routine_completions"), snap=>{
    completions={}; completionHistory=[];
    snap.forEach(d=>{
      const x=d.data();
      completionHistory.push({id:d.id,...x});
      const r=routines.find(rr=>rr.id===x.routineId);
      if(x.shared && x.routineId) completions[`shared_${x.date}_${x.routineId}`]=true;
      else if(r && d.id===routineCompletionKey(r)) completions[d.id]=true;
      else if(!r && (x.date===todayKey() || x.period===weekKey() || x.period==="project")) completions[d.id]=true;
    });
    render();
  }, err=>console.error("completions",err)));

  unsubscribers.push(onSnapshot(query(collection(db,"shared_items"),orderBy("createdAt","desc")), snap=>{
    sharedItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("shared",err)));

  unsubscribers.push(onSnapshot(collection(db,"shared_rhythms"), snap=>{
    sharedRhythms=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    render();
  }, err=>console.error("shared rhythms",err)));

  unsubscribers.push(onSnapshot(query(collection(db,"entries"),orderBy("createdAt","desc"),limit(40)), snap=>{
    recentEntries=snap.docs.map(d=>({id:d.id,...d.data()}));
    memories=recentEntries.filter(x=>x.type==="Memory");
    render();
    maybeNotify(recentEntries[0]);
  }, err=>console.error("entries",err)));

  unsubscribers.push(onSnapshot(query(collection(db,"life_items"),orderBy("createdAt","desc")), snap=>{
    lifeItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("life",err)));
  
  unsubscribers.push(onSnapshot(query(collection(db,"todos"),orderBy("createdAt","desc")), snap=>{
    todos=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, err=>console.error("todos",err)));
}

let lastNotifiedId = sessionStorage.getItem("last_notified_entry");
function maybeNotify(e) {
  if (!e?.id || !e.sender || e.sender===currentUser || e.id===lastNotifiedId) return;
  lastNotifiedId=e.id; sessionStorage.setItem("last_notified_entry",e.id);
  if (document.hidden && "Notification" in window && Notification.permission==="granted") {
    new Notification(`${e.sender} added ${e.type || "something"} to Our Space`, {body:e.text ? e.text.slice(0,90) : "Tap to open Our Space."});
  }
}

async function seedIfEmpty() {
  const snap=await getDocs(query(collection(db,"routines"),limit(1)));
  if (snap.empty) { for (const owner of PEOPLE) { for (const [name,frequency,category,nonNegotiable] of starterRoutines[owner]) { await addDoc(collection(db,"routines"),{name,frequency,category,nonNegotiable,owner,archived:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()}); } } }
  const sharedSnap=await getDocs(query(collection(db,"shared_rhythms"),limit(1)));
  if(sharedSnap.empty){for(let i=0;i<DEFAULT_SHARED_RHYTHMS.length;i++){const [name,icon,category]=DEFAULT_SHARED_RHYTHMS[i];await addDoc(collection(db,"shared_rhythms"),{name,icon,category,order:i,active:true,createdAt:serverTimestamp()});}}
}

  localStorage.setItem("our_space_identity",currentUser);
  render();
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ closeSheet(); closeRoutineSheet(); }
});

try {
  await seedIfEmpty();
  listenAll();
  initTheme();
render();
} catch(e) {
  console.error(e);
  document.getElementById("app").innerHTML=`<div class="card p-6 mt-6"><h2 class="serif text-2xl">Firebase needs attention.</h2><p class="subtle text-sm mt-2">The app loaded, but it couldn't reach Firestore. Check your Firebase project, Firestore database and security rules.</p><pre class="mono text-[10px] mt-4 whitespace-pre-wrap opacity-60">${esc(e.message)}</pre></div>`;
}

/* ===== FINAL UX OVERRIDES: compact routine buckets + prayer wall ===== */
const OS_BUCKETS=[
 {key:'SPIRIT',label:'Spirit & Mind',icon:'☼'},
 {key:'BODY',label:'Body & Energy',icon:'✦'},
 {key:'LIFE',label:'Work, Growth & Life',icon:'◌'}
];
function osBucket(r){
 if(r.bucket && OS_BUCKETS.some(b=>b.key===r.bucket)) return r.bucket;
 const t=((r.name||'')+' '+(r.category||'')).toLowerCase();
 if(/pray|prayer|bible|devotion|faith|worship|scripture|church|dew|leverage/.test(t)) return 'SPIRIT';
 if(/gym|exercise|walk|run|workout|water|sleep|health|meal|food|stretch|fitness/.test(t)) return 'BODY';
 return 'LIFE';
}
function osBucketList(list,isOther=false){
 const groups=Object.fromEntries(OS_BUCKETS.map(b=>[b.key,[]]));
 list.forEach(r=>groups[osBucket(r)].push(r));
 return `<div class="space-y-2">${OS_BUCKETS.map((b,i)=>{const a=groups[b.key],done=a.filter(r=>completions[routineCompletionKey(r)]).length;return `<details class="card-soft rounded-2xl overflow-hidden" ${i===0?'open':''}><summary class="flex items-center gap-3 p-4 cursor-pointer list-none"><span class="w-9 h-9 rounded-xl grid place-items-center bg-white/[.06]">${b.icon}</span><span class="flex-1"><b class="text-sm">${b.label}</b><small class="block subtle mt-1">${done}/${a.length} complete</small></span><span class="mono text-[10px] opacity-60">${a.length}</span></summary><div class="px-3 pb-3 space-y-2">${a.length?a.map(r=>routineRowCompact(r,isOther)).join(''):'<div class="p-3 subtle text-xs">Nothing here yet.</div>'}</div></details>`}).join('')}</div>`;
}
function routineRowCompact(r,isOther){const done=!!completions[routineCompletionKey(r)];return `<div class="flex items-center gap-2"><button ${!isOther?`onclick="toggleRoutine('${r.id}')"`:"disabled"} class="flex-1 text-left flex items-center gap-3 p-3 rounded-xl bg-white/[.025] hover:bg-white/[.05]"><span class="check ${done?'done':''}"></span><span class="flex-1 min-w-0"><span class="block text-sm ${done?'line-through opacity-50':''}">${esc(r.name)}</span><span class="block subtle text-[10px] mt-1">${esc(r.category||'Routine')}${r.nonNegotiable?' · non-negotiable':''}</span></span></button>${!isOther?`<div class="action-group"><button class="icon-action" title="Edit" onclick="openRoutineEditor('${r.id}')">✎</button><button class="icon-action danger" title="Delete" onclick="archiveRoutine('${r.id}')">⌫</button></div>`:''}</div>`;}

function renderToday(){
 const mine=routines.filter(r=>r.owner===currentUser&&isActiveRoutine(r));
 const theirs=routines.filter(r=>r.owner===otherPerson()&&isActiveRoutine(r));
 const mineDone=mine.filter(r=>completions[routineCompletionKey(r)]).length;
 const theirDone=theirs.filter(r=>completions[routineCompletionKey(r)]).length;
 const pct=mine.length?Math.round(mineDone/mine.length*100):0;
 const myTodos=todos.filter(t=>t.owner===currentUser&&!t.completed), myCompletedTodos=todos.filter(t=>t.owner===currentUser&&t.completed);
 const recent=recentEntries.slice(0,3), sharedDone=sharedRhythms.filter(r=>sharedRhythmDone(r)).length;
 document.getElementById('app').innerHTML=`<section class="fade"><div class="pt-5 pb-7"><div class="editorial-kicker">${fmtDate()}</div><div class="flex items-end justify-between gap-5 mt-4"><div><h2 class="section-title">Today.</h2></div><div class="relative w-[72px] h-[72px] rounded-full ring grid place-items-center shrink-0" style="--pct:${pct}%"><div class="w-[55px] h-[55px] rounded-full bg-[#0a1911] grid place-items-center"><span class="mono text-[10px]">${mineDone}/${mine.length}</span></div></div></div></div>
 <div class="desktop-grid"><div class="space-y-5"><div class="card p-5 sm:p-6"><div class="flex items-start justify-between gap-4 mb-5"><div><div class="tiny-label">${esc(currentUser)}'s rhythm</div><h3 class="serif text-2xl mt-1">${esc(currentUser)}'s day.</h3></div><button onclick="openRoutineEditor()" class="secondary text-xs">+ Routine</button></div>${osBucketList(mine,false)}</div>
 <div class="card p-5 sm:p-6"><div class="editorial-kicker">Your one-off layer</div><h3 class="serif text-2xl mt-3">Personal To-Do.</h3><form onsubmit="addTodo(event)" class="flex gap-2 mt-4"><input id="new-todo-input" class="input flex-1 py-3 text-sm" placeholder="Add something small..." required><button type="submit" class="primary px-5">+</button></form><div class="mt-4 space-y-1">${myTodos.map(t=>renderTodo(t)).join('')}${myCompletedTodos.map(t=>renderTodo(t,true)).join('')}</div></div></div>
 <div class="space-y-5"><div class="card p-5 sm:p-6"><div class="editorial-kicker">${getPronoun(otherPerson())} day</div><div class="flex items-center justify-between mt-3"><div><h3 class="serif text-2xl">${esc(otherPerson())}'s day.</h3></div><span class="mono text-xs">${theirDone}/${theirs.length}</span></div><div class="mt-5">${osBucketList(theirs,true)}</div></div>
 <div class="card p-5 sm:p-6"><div class="editorial-kicker">Our shared rhythms</div><div class="flex items-end justify-between gap-3 mt-3"><div><h3 class="serif text-2xl">The three we do together.</h3><p class="quiet-note mt-2">One shared check means you both showed up.</p></div><span class="stat-soft">${sharedDone}/3</span></div><div class="mt-4">${sharedRhythms.length?sharedRhythms.map(renderSharedRhythm).join(''):'<div class="empty p-4 subtle text-sm">Your shared rhythms will appear here.</div>'}</div></div>
 <div class="card p-5 sm:p-6"><div class="flex items-center justify-between mb-4"><div><div class="editorial-kicker">Leave something</div><h3 class="serif text-2xl mt-3">For each other.</h3></div><span class="text-xl">♡</span></div><div class="grid grid-cols-3 gap-2"><button onclick="openSheet('note')" class="secondary py-4 text-left">✎<br><span class="text-[10px]">Note</span></button><button onclick="openSheet('appreciation')" class="secondary py-4 text-left">♡<br><span class="text-[10px]">Love note</span></button><button onclick="openSheet('memory')" class="secondary py-4 text-left">✦<br><span class="text-[10px]">Memory</span></button></div></div>${recent.length?`<div class="card p-5"><div class="editorial-kicker">Recently captured</div><div class="mt-3 space-y-2">${recent.map(renderEntryCompact).join('')}</div></div>`:''}</div></div></section>`;refreshNav();}

/* Store the user's bucket choice with the routine. Smart classification is only the default. */
const _openRoutineEditor=window.openRoutineEditor;
window.openRoutineEditor=function(editId=null){
 _openRoutineEditor(editId);
 const r=editId?routines.find(x=>x.id===editId):null;
 const cat=document.getElementById('r-category');
 if(cat && !document.getElementById('r-bucket')){const wrap=document.createElement('div');wrap.innerHTML=`<label class="tiny-label">Today bucket</label><select id="r-bucket" class="input mt-2">${OS_BUCKETS.map(b=>`<option value="${b.key}" ${osBucket(r||{})===b.key?'selected':''}>${b.label}</option>`).join('')}</select>`;cat.closest('.grid')?.appendChild(wrap);}
 const form=document.getElementById('routine-form');
 if(form && !form.dataset.bucketHook){form.dataset.bucketHook='1';const original=form.onsubmit;form.onsubmit=async ev=>{ev.preventDefault();const bucket=document.getElementById('r-bucket')?.value;const before=window.updateDoc;const origUpdate=window.updateDoc; // no-op markers; payload injection handled below
 const id=document.getElementById('routine-id').value; try{const payload={name:document.getElementById('r-name').value.trim(),frequency:document.getElementById('r-frequency').value,category:document.getElementById('r-category').value.trim()||'Other',bucket,nonNegotiable:document.getElementById('r-nonneg').checked,startDate:document.getElementById('r-start').value||null,endDate:document.getElementById('r-end').value||null,owner:currentUser,archived:false,updatedAt:serverTimestamp()};if(id) await updateDoc(doc(db,'routines',id),payload); else await addDoc(collection(db,'routines'),{...payload,createdAt:serverTimestamp()});closeRoutineSheet();showToast('Routine saved.');}catch(e){console.error(e);showToast("Couldn't save routine.");}};}
};

/* Prayer wall: weekly backend + today's focus. Data lives in life_items so it travels with Our Life backups. */
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function prayerFocusItems(){return lifeItems.filter(x=>x.type==='Prayer Focus');}
function todayPrayerFocus(){const day=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(new Date());return prayerFocusItems().find(x=>x.day===day)||null;}
function renderPrayerWall(){const today=todayPrayerFocus(), days=DAYS.map(d=>prayerFocusItems().find(x=>x.day===d)).filter(Boolean);return `<section class="card p-5 sm:p-7 mt-5"><div class="flex items-end justify-between gap-4"><div><div class="editorial-kicker">Prayer</div><h3 class="serif text-3xl mt-2">Prayer Wall.</h3></div><button class="secondary text-xs" onclick="openPrayerBackend()">Edit Monday–Sunday</button></div><div class="grid lg:grid-cols-[1.3fr_.7fr] gap-4 mt-6"><div class="soft-card p-6"><div class="tiny-label">Today · 4:30 AM</div><h4 class="serif text-2xl mt-2">Prayer Focus</h4>${today?`<p class="text-sm mt-4 whitespace-pre-wrap leading-7">${esc(today.text||'')}</p>${today.scripture?`<p class="serif italic mt-4 opacity-80">${esc(today.scripture)}</p>`:''}`:'<p class="quiet-note mt-4">No prayer focus has been entered for today yet.</p>'}</div><div class="soft-card p-6"><div class="tiny-label">Others</div><h4 class="serif text-2xl mt-2">Intercessory Watchlist.</h4><p class="quiet-note mt-3">People and situations you are keeping before God.</p><button class="secondary mt-5" onclick="openSheet('lifeItem',{type:'Intercessory Focus',icon:'🛐'})">+ Add focus</button></div></div></section>`;}
function openPrayerBackend(){const existing=prayerFocusItems();const modal=document.createElement('div');modal.className='fixed inset-0 z-[100] bg-black/70 backdrop-blur-md flex items-center justify-center p-4';modal.id='prayer-backend';modal.innerHTML=`<div class="card max-w-3xl w-full max-h-[90vh] overflow-auto p-6"><div class="flex justify-between items-center"><div><div class="editorial-kicker">Weekly prayer backend</div><h2 class="serif text-3xl mt-2">Prayer Focus</h2></div><button class="icon-action" onclick="this.closest('#prayer-backend').remove()">×</button></div><div class="space-y-4 mt-6">${DAYS.map(day=>{const x=existing.find(i=>i.day===day)||{};return `<div class="soft-card p-4"><div class="tiny-label">${day}</div><input id="pf-title-${day}" class="input mt-2" placeholder="Prayer focus title" value="${esc(x.title||'')}"><input id="pf-scripture-${day}" class="input mt-2" placeholder="Scripture backing" value="${esc(x.scripture||'')}"><textarea id="pf-text-${day}" class="input mt-2" rows="6" placeholder="Prayer points / notes">${esc(x.text||'')}</textarea></div>`}).join('')}</div><button class="primary w-full mt-5" onclick="savePrayerBackend()">Save weekly prayer focus</button></div>`;document.body.appendChild(modal);}
async function savePrayerBackend(){const existing=prayerFocusItems();try{for(const day of DAYS){const x=existing.find(i=>i.day===day);const data={type:'Prayer Focus',day,title:document.getElementById(`pf-title-${day}`).value.trim(),scripture:document.getElementById(`pf-scripture-${day}`).value.trim(),text:document.getElementById(`pf-text-${day}`).value.trim(),owner:currentUser,updatedAt:serverTimestamp()};if(x) await updateDoc(doc(db,'life_items',x.id),data);else await addDoc(collection(db,'life_items'),{...data,createdAt:serverTimestamp()});}document.getElementById('prayer-backend')?.remove();showToast('Weekly prayer focus saved.');renderLife();}catch(e){console.error(e);showToast("Couldn't save prayer focus.");}}

/* Replace Our Life with the requested hierarchy while preserving the existing Vision Board + four collections. */
const _oldRenderLife=renderLife;
renderLife=function(){
 _oldRenderLife();
 const app=document.getElementById('app');
 const hero=app.querySelector('.home-manifesto');
 if(hero){const text=[...hero.querySelectorAll('*')].find(x=>(x.textContent||'').includes('Vision, faith, growth'));if(text)text.remove();}
 const values=[...app.querySelectorAll('.card')].find(x=>(x.textContent||'').includes('Our Core Values.')); if(values){const k=values.querySelector('.editorial-kicker');if(k)k.textContent='Core values'; const q=values.querySelector('.quiet-note');if(q)q.remove();}
 const inter=[...app.querySelectorAll('.card')].find(x=>(x.textContent||'').includes('Intercessory Foci.'));
 if(inter){const section=document.createElement('div');section.innerHTML=renderPrayerWall();inter.replaceWith(section.firstElementChild);}
};

/* Current season: month + user-defined meaning. */
function refreshSeasonBadge(){const m=new Intl.DateTimeFormat('en-US',{month:'long'}).format(new Date());const msg=seasonMessage||'';const el=document.getElementById('season-badge-text');if(el)el.textContent=msg?`${m}: ${msg.replace(/^A season of /i,'Our season of ')}`:`${m}: Set your season`;}
const _applyTheme=applyTheme;
applyTheme=function(t){_applyTheme(t);refreshSeasonBadge();};

/* Best-effort morning notification while the web app is available. True background push requires a service worker/FCM deployment. */
function notifyTodayPrayer(){if(!('Notification' in window)||Notification.permission!=='granted')return;const now=new Date(),key=`${todayKey()}_prayer`;if(now.getHours()<4||localStorage.getItem('os_prayer_notified')===key)return;const p=todayPrayerFocus();if(p){new Notification('Our Space · Prayer Focus',{body:p.title||'Today’s prayer focus',tag:'our-space-prayer'});localStorage.setItem('os_prayer_notified',key);}}
setTimeout(notifyTodayPrayer,1200);

</script>
