<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Space</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Jost:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        suv: {
                            bg: '#121110',
                            card: '#1A1817',
                            gold: '#C5A25A',
                            text: '#D4CFC7',
                            muted: '#8A857D',
                            wine: '#78282B',
                            olive: '#3A4234'
                        }
                    },
                    fontFamily: {
                        serif: ['"Fraunces"', 'serif'],
                        sans: ['"Jost"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        * { -webkit-tap-highlight-color: transparent; }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.05;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        ::-webkit-scrollbar { width: 0px; display: none; }
        
        .glass-pill {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(197, 162, 90, 0.15);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
        }

        .seal-btn {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, theme('colors.suv.wine') 0%, #4A1619 80%);
            border: 1px solid rgba(197, 162, 90, 0.3);
            box-shadow: 0 10px 30px -10px theme('colors.suv.wine');
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .seal-btn:active { transform: scale(0.95); }
        .seal-btn:disabled { opacity: 0.7; transform: none; }

        .nav-item {
            color: theme('colors.suv.muted');
            transition: color 0.3s ease;
        }
        .nav-item.active { color: theme('colors.suv.gold'); }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .drawer-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .backdrop-fade { animation: fadeBg 0.3s ease forwards; }
        @keyframes fadeBg {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-suv-bg text-suv-text font-sans antialiased h-screen flex flex-col overflow-hidden relative selection:bg-suv-gold selection:text-suv-bg">

    <!-- Top Identity Header -->
    <header class="absolute top-0 w-full z-20 px-6 pt-6 flex justify-end">
        <select id="user-identity" class="bg-transparent text-[10px] font-mono uppercase tracking-widest text-suv-muted outline-none border-b border-suv-gold/30 pb-1 appearance-none text-right cursor-pointer">
            <option value="Motolani" class="bg-suv-bg text-suv-text">Motolani</option>
            <option value="Zusi" class="bg-suv-bg text-suv-text">Zusi</option>
        </select>
    </header>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto px-6 pt-16 pb-32 z-10 relative" id="main-container">
        
        <!-- ================= TAB 1: US (HOME) ================= -->
        <div id="tab-us" class="view-section fade-in space-y-10">
            
            <div class="text-center space-y-2">
                <h1 class="font-serif italic text-4xl text-white">Our Space</h1>
                <p id="current-date" class="font-mono text-[11px] uppercase tracking-widest text-suv-muted pt-2"></p>
            </div>

            <!-- Choose Again -->
            <section class="flex flex-col items-center justify-center py-6">
                <p class="font-serif italic text-xl text-suv-text mb-6">Today, I choose you.</p>
                <button id="choose-btn" class="seal-btn flex items-center justify-center">
                    <span class="absolute inset-2 rounded-full border border-suv-gold/30"></span>
                    <span id="choose-text" class="font-serif italic text-suv-gold text-lg">Seal it</span>
                </button>
                <div id="status-area" class="mt-4 hidden flex-col items-center fade-in">
                    <span class="font-mono text-[10px] uppercase tracking-widest text-suv-gold border border-suv-gold/50 rounded-full px-4 py-1">Sealed</span>
                    <p id="last-clicked-time" class="text-[10px] text-suv-muted font-mono mt-2"></p>
                </div>
            </section>

            <!-- Recent -->
            <section class="space-y-4">
                <p class="font-mono text-[10px] uppercase tracking-[0.15em] text-suv-gold border-b border-suv-gold/20 pb-2"><span id="recent-label">Recent</span></p>
                <div id="recent-container" class="bg-suv-card p-5 rounded-lg border border-suv-wine/30 relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-suv-wine"></div>
                    <p class="text-sm font-light text-suv-muted">Waiting for the next moment...</p>
                </div>
            </section>
        </div>

        <!-- ================= TAB 2: FEEL ================= -->
        <div id="tab-feel" class="view-section hidden fade-in space-y-8">
            <h2 class="font-serif italic text-3xl text-white">Inside</h2>
            <p class="font-light text-sm text-suv-muted">The emotional heartbeat of us.</p>
        </div>

        <!-- ================= TAB 3: PLAN ================= -->
        <div id="tab-plan" class="view-section hidden fade-in space-y-8">
            <h2 class="font-serif italic text-3xl text-white">Our Life</h2>
            <p class="font-light text-sm text-suv-muted">Building the foundation.</p>
        </div>

        <!-- ================= TAB 4: DREAM ================= -->
        <div id="tab-dream" class="view-section hidden fade-in space-y-8">
            <h2 class="font-serif italic text-3xl text-white">Our Future</h2>
            <p class="font-light text-sm text-suv-muted">Where we are going.</p>
        </div>
    </main>

    <!-- Floating Glassmorphism Pill Navigation -->
    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-[420px] glass-pill rounded-full px-6 py-4 flex justify-between items-center z-40">
        <button onclick="switchTab('us')" id="btn-us" class="nav-item active flex flex-col items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            <span class="text-[9px] font-mono uppercase tracking-widest">Us</span>
        </button>
        <button onclick="switchTab('feel')" id="btn-feel" class="nav-item flex flex-col items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span class="text-[9px] font-mono uppercase tracking-widest">Feel</span>
        </button>

        <!-- Main Action Button -->
        <div class="relative -top-6">
            <button onclick="toggleActionDrawer()" class="w-14 h-14 rounded-full bg-suv-gold text-suv-bg shadow-[0_0_20px_rgba(197,162,90,0.4)] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
        </div>

        <button onclick="switchTab('plan')" id="btn-plan" class="nav-item flex flex-col items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-[9px] font-mono uppercase tracking-widest">Plan</span>
        </button>
        <button onclick="switchTab('dream')" id="btn-dream" class="nav-item flex flex-col items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
            <span class="text-[9px] font-mono uppercase tracking-widest">Dream</span>
        </button>
    </nav>

    <!-- ACTION DRAWER -->
    <div id="action-drawer-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden backdrop-fade" onclick="toggleActionDrawer()"></div>
    <div id="action-drawer" class="fixed bottom-0 left-0 w-full bg-suv-card rounded-t-3xl border-t border-white/10 z-[70] hidden drawer-slide-up pb-10 pt-6 px-6">
        <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-8"></div>
        
        <p class="font-serif italic text-2xl text-white text-center mb-6">Capture a moment</p>
        
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-white/5 border border-white/10 p-4 rounded-xl flex flex-col items-center gap-3 active:bg-white/10 transition-colors">
                <div class="w-10 h-10 rounded-full bg-suv-gold/20 text-suv-gold flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </div>
                <span class="font-sans text-sm font-light">Voice</span>
            </button>
            
            <button class="bg-white/5 border border-white/10 p-4 rounded-xl flex flex-col items-center gap-3 active:bg-white/10 transition-colors">
                <div class="w-10 h-10 rounded-full bg-suv-wine/20 text-suv-wine flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </div>
                <span class="font-sans text-sm font-light">Note</span>
            </button>
            
            <button class="bg-white/5 border border-white/10 p-4 rounded-xl flex flex-col items-center gap-3 active:bg-white/10 transition-colors">
                <div class="w-10 h-10 rounded-full bg-suv-olive/20 text-[#8B9D77] flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <span class="font-sans text-sm font-light">Memory</span>
            </button>

            <button class="bg-white/5 border border-white/10 p-4 rounded-xl flex flex-col items-center gap-3 active:bg-white/10 transition-colors">
                <div class="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                </div>
                <span class="font-sans text-sm font-light">Plan</span>
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRB-cRm-iX6nXP_5-hF5ACelpqtvx-Bgo",
            authDomain: "project-us-15aa0.firebaseapp.com",
            projectId: "project-us-15aa0",
            storageBucket: "project-us-15aa0.firebasestorage.app",
            messagingSenderId: "77217285858",
            appId: "1:77217285858:web:428597d6ace8c2e55640bb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // State Management
        let currentUser = localStorage.getItem('our_space_identity') || 'Motolani';
        document.getElementById('user-identity').value = currentUser;

        const updateIdentity = () => {
            currentUser = document.getElementById('user-identity').value;
            localStorage.setItem('our_space_identity', currentUser);
            const otherPerson = currentUser === 'Motolani' ? 'Zusi' : 'Motolani';
            document.getElementById('recent-label').innerText = `Recent from ${otherPerson}`;
        };

        document.getElementById('user-identity').addEventListener('change', updateIdentity);
        updateIdentity(); // Run on load

        // Feature 1: Choose Again (Seal it)
        const chooseBtn = document.getElementById('choose-btn');
        const chooseText = document.getElementById('choose-text');
        const statusArea = document.getElementById('status-area');
        const timeDisplay = document.getElementById('last-clicked-time');

        chooseBtn.addEventListener('click', async () => {
            chooseBtn.disabled = true;
            chooseText.innerText = "Sealing...";
            try {
                await addDoc(collection(db, "choose_events"), { 
                    timestamp: serverTimestamp(), 
                    user: currentUser 
                });
            } catch (error) {
                console.error("Error saving seal:", error);
                chooseText.innerText = "Retry";
                chooseBtn.disabled = false;
            }
        });

        // Listen for latest seal
        const qChoose = query(collection(db, "choose_events"), orderBy("timestamp", "desc"), limit(1));
        onSnapshot(qChoose, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const data = change.doc.data();
                    const date = data.timestamp ? data.timestamp.toDate() : new Date();
                    chooseBtn.classList.add('hidden');
                    statusArea.classList.remove('hidden');
                    statusArea.classList.add('flex');
                    timeDisplay.innerText = `Last sealed: ${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                }
            });
        });

        // Feature 2: Feed Listener for "Recent"
        const recentContainer = document.getElementById('recent-container');
        const qTimeline = query(collection(db, "voice_notes"), orderBy("timestamp", "desc"), limit(10));
        
        onSnapshot(qTimeline, (snapshot) => {
            const allDocs = [];
            snapshot.forEach((docSnap) => allDocs.push({ id: docSnap.id, ...docSnap.data() }));
            
            const otherPerson = currentUser === 'Motolani' ? 'Zusi' : 'Motolani';
            const recentFromOther = allDocs.find(d => d.sender === otherPerson);
            
            if (recentFromOther) {
                const isAudio = recentFromOther.format === 'audio';
                const date = recentFromOther.timestamp ? recentFromOther.timestamp.toDate() : new Date();
                const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                recentContainer.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-suv-wine"></div>
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-mono uppercase tracking-widest text-suv-muted">${recentFromOther.type || 'Note'}</span>
                        <span class="text-[10px] font-mono text-suv-muted">${timeStr}</span>
                    </div>
                    ${isAudio ? 
                        `<audio src="${recentFromOther.url}" controls class="w-full mt-2"></audio>` : 
                        `<p class="font-serif italic text-lg text-white mb-3">"${recentFromOther.content}"</p>`
                    }
                `;
            }
        });
    </script>

    <script>
        // Set dynamic date
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', dateOptions);

        // Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`btn-${tabId}`).classList.add('active');
            document.getElementById('main-container').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Action Drawer Toggle
        function toggleActionDrawer() {
            const drawer = document.getElementById('action-drawer');
            const overlay = document.getElementById('action-drawer-overlay');
            
            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                overlay.classList.remove('hidden');
            } else {
                drawer.classList.add('hidden');
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
